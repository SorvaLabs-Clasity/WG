AWSTemplateFormatVersion: "2010-09-09"

# The role the GitHub Control Hub uses to look at this AWS account.
#
# For a whole organisation, use scripts/deploy-guardrail-role-org-wide.sh
# instead of running this per account. It deploys this same template as a
# StackSet: every existing account and every account created afterwards, in one
# command.
#
# For a single account:
#
#   aws cloudformation deploy \
#     --template-file guardrail-account-role.yaml \
#     --stack-name control-hub-guardrail-access \
#     --capabilities CAPABILITY_NAMED_IAM \
#     --profile <the target account> \
#     --parameter-overrides \
#       ControlHubRoleArn=arn:aws:iam::<home account>:role/<lambda role> \
#       ExternalId=<a string you choose>
#
# Both values are printed by the Control Hub's own stack, as
# GuardrailLambdaRoleArn and GuardrailRoleName.
#
# Why a role rather than an access key: this account decides who may look at
# it, and revoking that decision is deleting this stack. There is no secret to
# store in the app, none to rotate, none to leak. Every call lands in this
# account's own CloudTrail under the session name "control-hub-guardrails", so
# the account can see exactly what was read.

Description: >
  Read-only access to S3 and CloudWatch Logs *configuration* for the GitHub
  Control Hub. Cannot read the contents of any bucket or any log. Grants no
  ability to change anything unless ReadOnly is explicitly set to false.

Parameters:
  ControlHubRoleArn:
    Type: String
    Description: >
      ARN of the Control Hub's role in the account where it runs. This is the
      only principal that can assume the role created here.
    AllowedPattern: "^arn:aws[a-z-]*:iam::\\d{12}:role/.+$"

  RoleName:
    Type: String
    Default: github-control-hub-guardrail-access
    Description: >
      Must match the GuardrailRoleName output of the Control Hub stack. The
      Control Hub's permission to assume is scoped to this exact name, and it
      has no other role it is allowed to assume anywhere.

  ExternalId:
    Type: String
    Default: ""
    NoEcho: true
    Description: >
      Optional shared string the Control Hub must present. Worth setting: it
      closes the confused-deputy case where another installation of this app
      could name your account and be let in.

  ReadOnly:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >
      Default "true": the Control Hub can report on this account and is
      incapable of changing it. A rule set to enforce still finds the violation
      and still records the fix it would have made; AWS refuses the write and
      the finding says so. Set "false" only where you want automatic
      remediation — it grants exactly three actions and nothing else.

Conditions:
  HasExternalId: !Not [!Equals [!Ref ExternalId, ""]]
  CanRemediate: !Equals [!Ref ReadOnly, "false"]

Resources:
  GuardrailAccessRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      Description: >
        Read compliance configuration for the GitHub Control Hub.
        Configuration only — never the contents of a bucket or a log.
      # One hour. The Control Hub renews with five minutes to spare, so a sweep
      # that starts near expiry does not fail partway through an account.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Ref ControlHubRoleArn
            Action: sts:AssumeRole
            Condition: !If
              - HasExternalId
              - StringEquals:
                  sts:ExternalId: !Ref ExternalId
              - !Ref AWS::NoValue
      Policies:
        - PolicyName: ReadConfiguration
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Six actions, all Describe/List/Get on settings.
              #
              # Note what is absent. s3:GetObject is not here, so this role
              # cannot read the contents of any bucket. logs:GetLogEvents and
              # FilterLogEvents are not here, so it cannot read a single log
              # line. It sees whether a bucket has a policy and how long a log
              # group keeps data. Configuration, never content.
              #
              # "*" is not a choice made here: ListAllMyBuckets and
              # DescribeLogGroups are account-wide operations that IAM does not
              # let you scope, and the Gets have to reach whichever resources
              # turn out to exist.
              - Sid: ReadConfigurationOnly
                Effect: Allow
                Action:
                  - s3:ListAllMyBuckets
                  - s3:GetBucketLocation
                  - s3:GetBucketPolicy
                  - s3:GetBucketTagging
                  - logs:DescribeLogGroups
                  - logs:ListTagsForResource
                Resource: "*"

        - !If
          - CanRemediate
          - PolicyName: RemediateThreeThings
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                # Exactly the three calls the two enforceable rules make. Not
                # s3:* and not logs:*, so a future version of this app cannot
                # quietly start doing something this account never agreed to
                # without the policy visibly changing.
                - Sid: Remediate
                  Effect: Allow
                  Action:
                    - s3:PutBucketPolicy
                    - logs:PutRetentionPolicy
                    - logs:DeleteRetentionPolicy
                  Resource: "*"
          - !Ref AWS::NoValue

  # The allow-lists above already grant nothing else, so these denies change
  # nothing today. They exist because an explicit Deny cannot be overridden by
  # any Allow, from any policy, ever — so if someone later attaches a broader
  # policy to this role, by accident or otherwise, it still cannot be used to
  # read your data, delete anything, or hand out access.
  NeverPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: ControlHubNever
      Roles:
        - !Ref GuardrailAccessRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: NeverReadData
            Effect: Deny
            Action:
              - s3:GetObject
              - s3:GetObjectVersion
              - s3:GetObjectAcl
              - logs:GetLogEvents
              - logs:FilterLogEvents
              - logs:StartQuery
            Resource: "*"

          - Sid: NeverDestroy
            Effect: Deny
            Action:
              - s3:DeleteBucket
              - s3:DeleteBucketPolicy
              - s3:DeleteObject
              - s3:DeleteObjectVersion
              - logs:DeleteLogGroup
              - logs:DeleteLogStream
            Resource: "*"

          - Sid: NeverWidenAccess
            Effect: Deny
            Action:
              # Every way this role could be used to expose something, or to
              # become something else. sts:AssumeRole here blocks role
              # chaining — it does not affect the Control Hub assuming this
              # role, which is governed by the trust policy above.
              - iam:*
              - sts:AssumeRole
              - s3:PutBucketAcl
              - s3:PutObjectAcl
              - s3:PutBucketPublicAccessBlock
              - s3:DeletePublicAccessBlock
              - s3:PutAccountPublicAccessBlock
              - s3:PutBucketWebsite
            Resource: "*"

Outputs:
  RoleArn:
    Description: The role the Control Hub will assume in this account.
    Value: !GetAtt GuardrailAccessRole.Arn

  AccountId:
    Description: This account's id.
    Value: !Ref AWS::AccountId

  CanChangeAnything:
    Description: Whether this deployment lets the Control Hub modify this account.
    Value: !If [CanRemediate, "yes - three write actions", "no - read-only"]
