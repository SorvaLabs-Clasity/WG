name: Build & Release

on:
  push:
    branches: [main]
    # A release is an app build. A push that only touches documentation has
    # nothing new to package, and the version in package.json has not moved —
    # so publishing would fail on a release tag that already exists. Left
    # unfiltered, main collects red crosses on markdown commits, and a workflow
    # that is normally red is one whose real failures nobody reads.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.gitignore'

# Read by default. Only the release job writes, and it says so itself.
#
# Granting contents: write here handed the same repo-writing token to the build
# matrix, which checks out the tree, installs several hundred packages from npm
# and runs their lifecycle scripts on two runners. Nothing in that job publishes
# anything; it uploads artifacts, which needs no contents scope at all.
permissions:
  contents: read

jobs:
  # ── Build each platform, publish nothing ────────────────────────────
  #
  # Letting electron-builder publish from both runners is what broke every
  # release before this. Each one creates its own draft when it cannot find
  # the other's — GitHub permits several drafts on a single tag — so the repo
  # ended up with two v1.0.42 releases, one holding the macOS build and one
  # the Windows build, and the publish step promoted whichever it resolved
  # first. The run went green having shipped half a release.
  #
  # Serialising the matrix did not help, because the problem is two writers
  # rather than two simultaneous writers. So the runners build and hand their
  # output to the release job, which is the only thing that talks to the
  # Releases API.
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install workspace dependencies
        working-directory: github-control-hub
        run: npm ci

      - name: Build backend
        working-directory: github-control-hub/backend
        run: npx tsc

      - name: Build frontend
        working-directory: github-control-hub/frontend
        run: npm run build

      - name: Install desktop app dependencies
        working-directory: github-control-hub/desktop
        run: npm ci

      - name: Bundle backend deps for packaging
        working-directory: github-control-hub/desktop
        shell: bash
        run: node -e "const fs=require('fs'),p=require('path');const d=p.join(__dirname,'.backend-modules');fs.rmSync(d,{recursive:true,force:true});fs.mkdirSync(d,{recursive:true});fs.copyFileSync(p.join(__dirname,'..','backend','package.json'),p.join(d,'package.json'))" && cd .backend-modules && npm install --omit=dev --ignore-scripts

      - name: Build the Electron app
        working-directory: github-control-hub/desktop
        # Windows runners default to PowerShell, which does not understand
        # bash's line continuations.
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        # onTag, and no GH_TOKEN. Two belts, because on CI electron-builder's
        # default policy is `always` — it will try to publish and then fail on
        # the missing token, which is exactly what it did. onTag only fires
        # when the ref is a tag, and this workflow runs on a branch.
        #
        # `--publish never` would say it more plainly, but electron-builder 26
        # nulls the publish config and then crashes dereferencing it while
        # writing the update manifests. onTag leaves the config intact, so
        # latest-mac.yml and latest.yml are still produced — which is the whole
        # reason the build needs a publish config at all.
        run: |
          npx tsc -p tsconfig.json
          npx electron-builder --${{ runner.os == 'macOS' && 'mac' || 'win' }} --publish onTag

      - name: Hand the installers to the release job
        uses: actions/upload-artifact@v7
        with:
          name: installers-${{ runner.os }}
          if-no-files-found: error
          retention-days: 1
          path: |
            github-control-hub/desktop/release/*.dmg
            github-control-hub/desktop/release/*.exe
            github-control-hub/desktop/release/*.zip
            github-control-hub/desktop/release/*.blockmap
            github-control-hub/desktop/release/latest*.yml

  # ── One job, one release ────────────────────────────────────────────
  release:
    needs: build
    runs-on: ubuntu-latest
    # The one job that talks to the Releases API is the one job that may write.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Collect both platforms
        uses: actions/download-artifact@v8
        with:
          path: installers
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./github-control-hub/desktop/package.json').version")
          TAG="v${VERSION}"

          # electron-builder names files with spaces and then writes the
          # hyphenated form into the manifests. Uploading the spaced names
          # lets GitHub substitute dots instead, so every url in the manifest
          # points at a file that does not exist and updating 404s — on a
          # release that looks perfectly complete.
          cd installers
          for f in *\ *; do [ -e "$f" ] && mv -- "$f" "${f// /-}"; done
          cd ..

          echo "Assets for ${TAG}:"
          ls -la installers/

          # Both manifests or nothing. They are what installed copies read to
          # find an update, so a release missing one silently stops updating
          # that platform.
          for f in latest-mac.yml latest.yml; do
            test -f "installers/$f" || {
              echo "::error::$f is missing — refusing to publish half a release"
              exit 1
            }
          done

          # And every file a manifest names has to actually be here. Checking
          # the manifests exist is not the same as checking they resolve, and
          # the difference is a release that updates nobody.
          missing=0
          for m in installers/latest-mac.yml installers/latest.yml; do
            for url in $(grep -oE '^\s+- url: .+$' "$m" | sed 's/.*url: //'); do
              test -f "installers/$url" || { echo "::error::$m points at $url, which was not built"; missing=1; }
            done
          done
          [ "$missing" = 0 ] || exit 1

          # A tag can carry several drafts, which is how this used to go
          # wrong. Clear anything left by an earlier attempt at this version
          # before creating the real one.
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true

          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --latest \
            installers/*
