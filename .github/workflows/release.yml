name: Build & Release

on:
  push:
    branches: [main]
    # A release is an app build. A push that only touches documentation has
    # nothing new to package, and the version in package.json has not moved —
    # so publishing would fail on a release tag that already exists. Left
    # unfiltered, main collects red crosses on markdown commits, and a workflow
    # that is normally red is one whose real failures nobody reads.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.gitignore'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install workspace dependencies
        working-directory: github-control-hub
        run: npm ci

      - name: Build backend
        working-directory: github-control-hub/backend
        run: npx tsc

      - name: Build frontend
        working-directory: github-control-hub/frontend
        run: npm run build

      - name: Install desktop app dependencies
        working-directory: github-control-hub/desktop
        run: npm ci

      - name: Bundle backend deps for packaging
        working-directory: github-control-hub/desktop
        run: node -e "const fs=require('fs'),p=require('path');const d=p.join(__dirname,'.backend-modules');fs.rmSync(d,{recursive:true,force:true});fs.mkdirSync(d,{recursive:true});fs.copyFileSync(p.join(__dirname,'..','backend','package.json'),p.join(d,'package.json'))" && cd .backend-modules && npm install --omit=dev --ignore-scripts
        shell: bash

      - name: Build & publish Electron app
        working-directory: github-control-hub/desktop
        # Windows runners default to PowerShell, which does not understand the
        # backslash line continuations below — it read the second line as a
        # command called "-c" and failed. Every multi-line step in this matrix
        # needs this, and the one above already had it.
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          npx tsc -p tsconfig.json
          # Owner and repo come from the checkout rather than package.json, so
          # forking this into another organisation needs no edit and installed
          # copies check the repo they were actually built from.
          npx electron-builder --publish always \
            -c.publish.owner="${{ github.repository_owner }}" \
            -c.publish.repo="${{ github.event.repository.name }}"

  publish-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./github-control-hub/desktop/package.json').version")
          TAG="v${VERSION}"
          echo "Publishing release ${TAG}..."
          # Wait a moment for assets to finish uploading
          sleep 10
          gh release edit "$TAG" --draft=false --latest
