name: Build & Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install workspace dependencies
        working-directory: github-control-hub
        run: npm ci

      - name: Build backend
        working-directory: github-control-hub/backend
        run: npx tsc

      - name: Build frontend
        working-directory: github-control-hub/frontend
        run: npm run build

      - name: Install desktop app dependencies
        working-directory: github-control-hub-cmd-desktop-app
        run: npm ci

      - name: Bundle backend deps for packaging
        working-directory: github-control-hub-cmd-desktop-app
        run: node -e "const fs=require('fs'),p=require('path');const d=p.join(__dirname,'.backend-modules');fs.rmSync(d,{recursive:true,force:true});fs.mkdirSync(d,{recursive:true});fs.copyFileSync(p.join(__dirname,'..','github-control-hub','backend','package.json'),p.join(d,'package.json'))" && cd .backend-modules && npm install --omit=dev --ignore-scripts
        shell: bash

      - name: Build & publish Electron app
        working-directory: github-control-hub-cmd-desktop-app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx tsc -p tsconfig.json
          npx electron-builder --publish always
