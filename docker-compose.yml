services:
  app:
    build: .
    ports:
      - "4321:4321"
    environment:
      - PORT=4321
      # No default: the container inherits the region you are actually using.
      - AWS_REGION=${AWS_REGION:?set AWS_REGION before docker compose up}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN}
    restart: unless-stopped
