AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: GitHub Control Hub — API Gateway + Lambda backend

Globals:
  Function:
    Timeout: 30
    Runtime: nodejs20.x
    MemorySize: 256
    Environment:
      Variables:
        GITHUB_ORG: !Ref GitHubOrg
        FRONTEND_URL: !Ref FrontendUrl
        BACKEND_URL: !Ref BackendUrl
        NODE_ENV: production

Parameters:
  SecretName:
    Type: String
    Default: github-control-hub/secrets
    Description: Secrets Manager secret name (edit infra/constants.ts)
  GitHubOrg:
    Type: String
    Default: your-github-org
    Description: GitHub organization name (edit infra/constants.ts)
  FrontendUrl:
    Type: String
    Default: https://your-frontend-domain.com
    Description: Frontend URL (edit infra/constants.ts)
  BackendUrl:
    Type: String
    Default: https://your-api-domain.com
    Description: Backend API URL (edit infra/constants.ts)

Resources:
  GitHubControlHubApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: !Sub "'${FrontendUrl}'"

  BackendFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: dist/lambda.handler
      Timeout: 30
      MemorySize: 512
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${SecretName}-*"
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:Query
                - dynamodb:Scan
                - dynamodb:BatchWriteItem
              Resource:
                - !GetAtt ActivityTable.Arn
                - !GetAtt TemplatesTable.Arn
                - !GetAtt ScannersTable.Arn
                - !GetAtt AlertsTable.Arn
                - !GetAtt OrgConfigTable.Arn
                - !GetAtt AuthCodesTable.Arn
                - !GetAtt GraphEdgesTable.Arn
                - !GetAtt ExclusionsTable.Arn
                - !GetAtt WidgetsTable.Arn
                - !GetAtt ComplianceCacheTable.Arn
      Environment:
        Variables:
          SECRET_NAME: !Ref SecretName
          ACTIVITY_TABLE: !Ref ActivityTable
          TEMPLATES_TABLE: !Ref TemplatesTable
          SCANNERS_TABLE: !Ref ScannersTable
          ALERTS_TABLE: !Ref AlertsTable
          ORG_CONFIG_TABLE: !Ref OrgConfigTable
          AUTH_CODES_TABLE: !Ref AuthCodesTable
          GRAPH_EDGES_TABLE: !Ref GraphEdgesTable
          EXCLUSIONS_TABLE: !Ref ExclusionsTable
          WIDGETS_TABLE: !Ref WidgetsTable
          COMPLIANCE_CACHE_TABLE: !Ref ComplianceCacheTable
      Events:
        ProxyRoot:
          Type: Api
          Properties:
            RestApiId: !Ref GitHubControlHubApi
            Path: /
            Method: ANY
        ProxyAll:
          Type: Api
          Properties:
            RestApiId: !Ref GitHubControlHubApi
            Path: /{proxy+}
            Method: ANY

  # --- DynamoDB Tables ---

  ActivityTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-activity"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  TemplatesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-templates"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  ScannersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-scanners"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  AlertsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-alerts"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  OrgConfigTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-org-config"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: org
          AttributeType: S
      KeySchema:
        - AttributeName: org
          KeyType: HASH

  AuthCodesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-auth-codes"
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      AttributeDefinitions:
        - AttributeName: code
          AttributeType: S
      KeySchema:
        - AttributeName: code
          KeyType: HASH

  GraphEdgesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-graph-edges"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  ExclusionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-exclusions"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  WidgetsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-widgets"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  ComplianceCacheTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-compliance-cache"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: repo
          AttributeType: S
      KeySchema:
        - AttributeName: repo
          KeyType: HASH

  # --- S3 Bucket for Frontend ---

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-frontend"
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                "AWS:SourceArn": !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}"

  # --- CloudFront Distribution ---

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !Ref CloudFrontOAC
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: ApiOrigin
            DomainName: !Sub "${GitHubControlHubApi}.execute-api.${AWS::Region}.amazonaws.com"
            OriginPath: /prod
            CustomOriginConfig:
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          ForwardedValues:
            QueryString: false
          Compress: true
        CacheBehaviors:
          - PathPattern: "/api/*"
            TargetOriginId: ApiOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            ForwardedValues:
              QueryString: true
              Headers:
                - Authorization
                - Content-Type
                - Origin
                - Access-Control-Request-Headers
                - Access-Control-Request-Method
            MinTTL: 0
            DefaultTTL: 0
            MaxTTL: 0
          - PathPattern: "/auth/*"
            TargetOriginId: ApiOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            ForwardedValues:
              QueryString: true
              Headers:
                - Origin
                - Access-Control-Request-Headers
                - Access-Control-Request-Method
            MinTTL: 0
            DefaultTTL: 0
            MaxTTL: 0
          - PathPattern: "/health"
            TargetOriginId: ApiOrigin
            ViewerProtocolPolicy: redirect-to-https
            ForwardedValues:
              QueryString: false
            MinTTL: 0
            DefaultTTL: 60
            MaxTTL: 60
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # --- Background Workers ---
  
  AuditLogCheckFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: dist/jobs/auditLogChecker.handler
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${SecretName}-*"
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !GetAtt OrgConfigTable.Arn
      Environment:
        Variables:
          SECRET_NAME: !Ref SecretName
          ORG_CONFIG_TABLE: !Ref OrgConfigTable
      Events:
        CheckSchedule:
          Type: Schedule
          Properties:
            Schedule: "rate(6 hours)"
            Name: AuditLogAccessCheck
            Description: "Checks if GitHub Enterprise Audit Logs are accessible every 6 hours"

  GraphAggregatorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: dist/jobs/graphAggregator.handler
      Timeout: 300
      MemorySize: 512
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${SecretName}-*"
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:BatchWriteItem
                - dynamodb:Query
                - dynamodb:Scan
                - dynamodb:DeleteItem
              Resource:
                - !GetAtt GraphEdgesTable.Arn
                - !GetAtt ComplianceCacheTable.Arn
                - !GetAtt OrgConfigTable.Arn
      Environment:
        Variables:
          SECRET_NAME: !Ref SecretName
          GRAPH_EDGES_TABLE: !Ref GraphEdgesTable
          COMPLIANCE_CACHE_TABLE: !Ref ComplianceCacheTable
          ORG_CONFIG_TABLE: !Ref OrgConfigTable
      Events:
        AggregateSchedule:
          Type: Schedule
          Properties:
            Schedule: "rate(6 hours)"
            Name: GraphAggregatorSchedule
            Description: "Aggregates GitHub data into Knowledge Graph every 6 hours"

Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${GitHubControlHubApi}.execute-api.${AWS::Region}.amazonaws.com/prod/"
  FrontendBucketName:
    Description: S3 bucket name for frontend static assets
    Value: !Ref FrontendBucket
  CloudFrontDomain:
    Description: CloudFront distribution domain name
    Value: !GetAtt CloudFrontDistribution.DomainName
  CloudFrontDistributionId:
    Description: CloudFront distribution ID (for cache invalidation)
    Value: !Ref CloudFrontDistribution
